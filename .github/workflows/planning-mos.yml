name: Planning forecast MOS mirror

on:
  schedule:
    - cron: "12,42 * * * *"     # twice an hour; LAMP updates hourly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/planning-mos.yml"]

permissions:
  contents: write

concurrency:
  group: planning-mos
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mirror MOS, LAMP, NBM text and SPC outlooks
        run: python pipeline/planning_mos.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/mos/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Planning MOS mirror $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
