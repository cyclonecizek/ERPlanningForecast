name: Build standalone file

on:
  push:
    branches: [main]
    paths:
      - "docs/*.js"
      - "docs/index.html"
      - "docs/exposure.html"
      - "docs/burn.html"
      - "docs/lmef.html"
      - "docs/taf.html"
      - "docs/verify.html"
      - "docs/45ws-logo.png"
      - "docs/ussf-seal.png"
      - "pipeline/build_standalone.py"
      - ".github/workflows/standalone.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ER_Weather_Tools.html
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python pipeline/build_standalone.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ER_Weather_Tools.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Standalone file $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
