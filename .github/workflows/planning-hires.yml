name: Planning forecast high-res guidance

on:
  schedule:
    - cron: "35 * * * *"        # hourly; only new 00/06/12/18Z runs are downloaded
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/planning_hires.py", ".github/workflows/planning-hires.yml"]

permissions:
  contents: write

concurrency:
  group: planning-hires
  cancel-in-progress: false

jobs:
  hires:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/planning-hires.yml
      - name: Install GRIB reader
        run: pip install numpy pygrib
      - name: RRFS, REFS members, HREF and REFS calibrated thunder
        env:
          HIRES_BUDGET_MIN: "35"
        run: python pipeline/planning_hires.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/hires.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Planning high-res guidance $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
